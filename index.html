<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三國幻戰 - 序列對照工具 Pro Tab</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #0088a8;
            --primary-hover: #3558d6;
            --predict-bg: #ffddaa; 
            --predict-border: #ff7700;
            --border: #e2e8f0; 
            --bg: #f1f5f9; 
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --highlight-red: #ff5511; 
            --match-bg: #cceeff;
            --match-border: #0088a8;
        }
        
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg); 
            color: var(--text-main);
            margin: 0; 
            padding: 0; 
            -webkit-font-smoothing: antialiased;
        }
        
        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 10px 5px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        /* 彈數選擇橫幅 */
        .version-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            margin: 0 auto 10px auto;
            max-width: 900px;
            scrollbar-width: none;
        }
        .version-scroll::-webkit-scrollbar { display: none; }
        
        .v-tab-btn {
            flex-shrink: 0;
            padding: 10px 24px;
            border-radius: 20px;
            background: #e2e8f0;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .v-tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 136, 168, 0.3);
        }

        .search-section { 
            background: var(--card-bg);
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            max-width: 900px; 
            margin: auto;
        }
        
        .search-grid { display: flex; gap: 8px; align-items: center; }
        .inputs-group { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        
        .input-icon { position: absolute; left: 10px; color: var(--text-muted); pointer-events: none; font-size: 14px; }

        input { 
            width: 100%;
            box-sizing: border-box; padding: 10px 10px 10px 32px; 
            border: 2px solid var(--border); border-radius: 8px; 
            font-size: 14px; outline: none;
            transition: all 0.3s ease; 
            background: #f8fafc;
        }
        input:focus { 
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 136, 168, 0.1);
        }
        
        .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
        
        .btn { 
            padding: 10px 14px;
            border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; 
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
            gap: 4px; 
        }
        .btn-search { background: var(--primary); color: white; }
        .btn-reset { background: #e2e8f0; color: var(--text-main); }

        .dataset-toggle {
            display: flex; gap: 8px; margin-top: 8px; margin-bottom: 0px;
        }
        .toggle-btn {
            flex: 1; padding: 8px 0; border-radius: 8px;
            border: 2px solid var(--primary); background: transparent;
            color: var(--primary); font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .toggle-btn.active {
            background: var(--primary); color: white;
            box-shadow: 0 4px 8px rgba(0, 136, 168, 0.2);
        }

        @media (max-width: 600px) {
            .search-grid { flex-direction: column; align-items: stretch; }
            .action-btns { width: 100%; }
            .btn { flex: 1; }
        }

        .tabs-container {
            display: flex; gap: 8px; margin-top: 8px; overflow-x: auto;
            padding-bottom: 2px; max-width: 900px; margin-left: auto;
            margin-right: auto; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            padding: 6px 16px; background: #e2e8f0; border: none;
            border-radius: 16px; cursor: pointer; white-space: nowrap;
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            transition: all 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        #resultsWrapper { padding: 10px 10px 40px 10px; max-width: 900px; margin: auto; }
        
        .result-panel { 
            display: none; background: var(--card-bg); border-radius: 12px; 
            border: 1px solid var(--border); height: 65vh; min-height: 400px;
            overflow: hidden; animation: slideUp 0.3s ease-out;
        }
        .result-panel.active { display: flex; flex-direction: column; }

        .panel-header { 
            padding: 12px 15px; background: var(--match-bg); border-bottom: 1px solid var(--match-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-title { color: var(--match-border); font-size: 14px; font-weight: 700; }
        .predict-badge { 
            background: var(--highlight-red); color: white; padding: 4px 10px;
            border-radius: 20px; font-size: 12px; 
        }
        
        .scroll-window { flex-grow: 1; overflow-y: auto; padding: 12px; }
        
        .sequence-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        @media (min-width: 600px) { .sequence-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; } }

        .item-card { 
            border: 1px solid var(--border); padding: 6px 4px; border-radius: 6px; 
            background: #fafafa; font-size: 14px; text-align: center;
        }
        .id-tag { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 2px;}
        .special-name { color: var(--highlight-red); font-weight: 900; }
        
        .match-active { border: 2px solid var(--match-border) !important; background: var(--match-bg) !important; }
        .predict-active { background: var(--predict-bg) !important; border: 2px solid var(--predict-border) !important; transform: scale(1.03); }

        .suggestions { 
            position: absolute; top: 100%; left: 0; right: 0; background: white; 
            border: 1px solid var(--border); z-index: 2000; max-height: 200px; 
            overflow-y: auto; border-radius: 8px; display: none; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 4px;
        }
        .suggest-item { padding: 10px 15px; cursor: pointer; font-size: 14px;}
        .suggest-item:hover { background: var(--match-bg); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>

</div>

        document.querySelectorAll('.v-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.v === v));
        resetAll();
    }

    function switchCard(c) {
        curCard = c;
        document.getElementById('btnA').classList.toggle('active', c === 'A');
        document.getElementById('btnB').classList.toggle('active', c === 'B');
        resetAll();
    }

    function triggerSearch() {
        const v1 = document.getElementById('input1').value.trim();
        const v2 = document.getElementById('input2').value.trim();
        const wrapper = document.getElementById('resultsWrapper');
        const tabBox = document.getElementById('tabsContainer');
        wrapper.innerHTML = ''; 
        tabBox.innerHTML = '';

        if(!v1 || !v2) return;

        let matches = [];
        const activeData = db[curVersion][curCard];

        if (!activeData || (Array.isArray(activeData) && activeData.length === 0)) {
            wrapper.innerHTML = `<div style="text-align:center; margin-top:80px; color:var(--highlight-red); font-weight:bold;">❌ 尚無此牌庫資料</div>`;
            return;
        }

        // 判斷是否為陣列結構
        if (!Array.isArray(activeData)) {
            const keys = Object.keys(activeData).filter(k => !isNaN(k)).map(Number).sort((a,b)=>a-b);
            const maxKey = keys[keys.length-1];
            matches = keys.filter(k => activeData[k] === v1 && activeData[k+1] === v2).map(k => ({
                index: k,
                data: activeData,
                name: `第 ${curVersion} 彈 ${curCard} 卡序列`,
                total: maxKey
            }));
        } else {
            activeData.forEach(seq => {
                const keys = Object.keys(seq).filter(k => !isNaN(k)).map(Number).sort((a,b)=>a-b);
                const maxKey = keys[keys.length-1];
                keys.forEach(k => {
                    if (seq[k] === v1 && seq[k+1] === v2) {
                        matches.push({ index: k, data: seq, name: seq.name, total: maxKey });
                    }
                });
            });
        }
        
        if(matches.length === 0) {
            wrapper.innerHTML = `<div style="text-align:center; margin-top:80px; color:var(--highlight-red); font-weight:bold;">❌ 找不到對應序列</div>`;
            return;
        }

        matches.forEach((mObj, idx) => {
            const m = mObj.index;
            const tBtn = document.createElement('button');
            tBtn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
            const icon = '<i class="fa-solid fa-location-dot" style="margin-right:5px;"></i>';
            // 依據是否為陣列動態設定按鈕名稱
            tBtn.innerHTML = icon + (!Array.isArray(activeData) 
                ? `結果 ${idx+1} (#${m})` : `${mObj.name.split(' ')[0]} (#${m})`);
            tBtn.onclick = () => switchTab(idx);
            tabBox.appendChild(tBtn);

            const panel = document.createElement('div');
            panel.className = `result-panel ${idx === 0 ? 'active' : ''}`;
            panel.id = `panel-${idx}`;
            panel.innerHTML = `
                <div class="panel-header">
                    <div class="panel-title">${mObj.name} - #${m}</div>
                    <div class="predict-badge">下一張：${mObj.data[m+2] || 'END'}</div>
                </div>
                <div class="scroll-window"><div class="sequence-grid" id="grid-${idx}"></div></div>
            `;
            wrapper.appendChild(panel);

            const grid = document.getElementById(`grid-${idx}`);
            for(let i=1; i<=mObj.total; i++) {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.id = `panel-${idx}-item-${i}`;
                
                if(i === m || i === m+1) card.classList.add('match-active');
                if(i === m+2) card.classList.add('predict-active');

                let content = mObj.data[i] || "";
                let isSpecial = redNames.some(n => content.includes(n));
                card.innerHTML = `<span class="id-tag">#${i}</span><b class="${isSpecial?'special-name':''}">${content}</b>`;
                grid.appendChild(card);
            }
            if(idx === 0) scrollToCenter(idx, m);
        });
    }

    function switchTab(idx) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.result-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
        
        const btnText = document.querySelectorAll('.tab-btn')[idx].innerText;
        const match = btnText.match(/#(\d+)/);
        if (match) {
            scrollToCenter(idx, parseInt(match[1]));
        }
    }

    function scrollToCenter(pIdx, m) {
        setTimeout(() => {
            const target = document.getElementById(`panel-${pIdx}-item-${m}`);
            if(target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function resetAll() {
        document.getElementById('input1').value = '';
        document.getElementById('input2').value = '';
        document.getElementById('tabsContainer').innerHTML = '';
        document.getElementById('resultsWrapper').innerHTML = `
            <div style="text-align:center; color:#94a3b8; margin-top:80px;">
                <i class="fa-solid fa-chart-line" style="font-size: 30px; color: #cbd5e1; margin-bottom: 10px;"></i>
                <div style="font-size: 14px;">請輸入連兩筆抽取紀錄以定位序列</div>
            </div>`;
    }

    function setupSuggest(id, lid) {
        const input = document.getElementById(id), list = document.getElementById(lid);
        input.onfocus = () => { if(id==='input2') input.value=''; showList(); };
        input.oninput = () => showList();

        function showList() {
            list.innerHTML = '';
            const v1 = document.getElementById('input1').value.trim();
            const activeData = db[curVersion][curCard];
            let opts = [];

            if (id === 'input1') {
                opts = uniqueItems[curVersion][curCard];
            } else {
                if (!activeData || (Array.isArray(activeData) && activeData.length === 0)) {
                    opts = [];
                // 判斷是否為陣列來提供第二張的提示
                } else if (!Array.isArray(activeData)) {
                    opts = Array.from(new Set(Object.keys(activeData).filter(k => activeData[k] === v1).map(k => activeData[parseInt(k)+1]).filter(v => v)));
                } else {
                    let nexts = [];
                    activeData.forEach(seq => {
                        const keys = Object.keys(seq).filter(k => !isNaN(k));
                        keys.forEach(k => {
                            k = Number(k);
                            if (seq[k] === v1 && seq[k+1]) nexts.push(seq[k+1]);
                        });
                    });
                    opts = Array.from(new Set(nexts));
                }
            }

            const filtered = opts.filter(o => o.includes(input.value.trim()));
            filtered.forEach(f => {
                const d = document.createElement('div');
                d.className = 'suggest-item';
                d.innerText = f;
                d.onclick = () => { 
                    input.value = f; 
                    list.style.display = 'none'; 
                    id === 'input1' ? document.getElementById('input2').focus() : triggerSearch(); 
                };
                list.appendChild(d);
            });
            list.style.display = filtered.length ? 'block' : 'none';
        }
        input.onblur = () => setTimeout(() => list.style.display = 'none', 200);
    }

    setupSuggest('input1', 'list1'); setupSuggest('input2', 'list2');
</script>

</body>
</html>
